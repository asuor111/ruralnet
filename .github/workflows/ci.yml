name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruralnet
          POSTGRES_PASSWORD: ruralnet
          POSTGRES_DB: ruralnet_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U ruralnet -d ruralnet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ruralnet:ruralnet@localhost:5432/ruralnet_test?schema=public
      TEST_DATABASE_URL: postgresql://ruralnet:ruralnet@localhost:5432/ruralnet_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Unit + integration tests (includes database tests)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test against the running server
        run: |
          node node_modules/next/dist/bin/next start -p 3100 & 
          npx wait-on http://localhost:3100/api/health
          RURALNET_BASE_URL=http://localhost:3100 npx tsx scripts/smoke.ts