services:
  postgres:
    image: postgres:16-alpine
    container_name: ruralnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruralnet
      POSTGRES_PASSWORD: ruralnet
      POSTGRES_DB: ruralnet
    ports:
      - '5432:5432'
    volumes:
      - ruralnet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruralnet -d ruralnet']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ruralnet_pgdata: